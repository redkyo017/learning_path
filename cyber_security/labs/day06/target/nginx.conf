worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name box;
        root /var/www/html;
        index index.html;

        # Stage-1 recon/enum surface: an nginx-autoindexed directory that
        # robots.txt names (Disallow: /backup/) but nothing links to.
        # Listing it is the "network enum" half of flag1; the file it
        # exposes is the "recon" half.
        location /backup/ {
            autoindex on;
        }
    }
}
