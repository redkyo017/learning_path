# Day 7 Defense Lab -- reverse proxy in front of `juiceshop` that adds the
# security headers and CORS policy the upstream app itself doesn't ship.
# This is the realistic pattern for hardening a third-party app you can't
# edit the source of: fix it at the edge, not in code you don't own.
#
# Compared with a direct `curl -sI juiceshop:3000/` (Attack Lab Step 4),
# `curl -sI hardened:8080/` against this same app should show every header
# below present. See content/day07-http.md Section 3 (Defense Lab) and
# SOLUTION.md for the exact before/after commands.

server {
    listen 8080;
    server_name hardened;

    location / {
        proxy_pass http://juiceshop:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Defense 1: security headers ---------------------------------
        # X-Content-Type-Options: stops the browser from "helpfully"
        # re-sniffing a response's content type against what the
        # Content-Type header actually declared -- the fix for MIME-
        # sniffing-based attacks (e.g. a file uploaded as an image that
        # the browser decides to execute as HTML/JS instead).
        add_header X-Content-Type-Options "nosniff" always;

        # X-Frame-Options: stops this app being rendered inside a hidden
        # <iframe> on someone else's page -- the classic clickjacking
        # defense predating CSP's frame-ancestors directive.
        add_header X-Frame-Options "DENY" always;

        # Content-Security-Policy: the modern, much stronger successor to
        # X-Frame-Options -- restricts which origins scripts, styles,
        # frames, etc. may load from at all, which is what actually stops
        # a reflected/stored XSS payload from running (Day 8 covers XSS
        # itself; this is the header-level mitigation layer for it).
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

        # Strict-Transport-Security: tells a browser that has ever loaded
        # this site over HTTPS to never downgrade to plain HTTP again,
        # closing the window for an SSL-stripping MITM. Named here for
        # completeness -- it is only meaningful once TLS actually
        # terminates in front of this app (this lab's `hardened` proxy is
        # plain HTTP-only, deliberately, to stay simple; a real deployment
        # would terminate TLS here or one hop further out).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Referrer-Policy: controls how much of THIS page's URL leaks into
        # the Referer header of requests it triggers to other origins
        # (images, links, etc.) -- "no-referrer" leaks none of it.
        add_header Referrer-Policy "no-referrer" always;

        # Permissions-Policy: explicitly denies browser features this app
        # has no legitimate use for, so an XSS payload (or a malicious
        # frame embedding this app, if X-Frame-Options/CSP ever regressed)
        # can't invoke them either.
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # --- Defense 2: correct CORS -------------------------------------
        # An explicit, single allowed origin -- never a bare wildcard "*"
        # combined with Allow-Credentials: true. That specific combination
        # is what turns CORS from "a sanctioned relaxation of SOP for one
        # named partner" into "any site on the internet can make
        # credentialed requests to this API and read the response" -- see
        # content/day07-http.md Section 1's CORS subsection and Drill 3.
        add_header Access-Control-Allow-Origin "https://trusted-partner.example" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
}
