# Day 11 detection: matches a FAILED /login attempt written by
# labs/day11/target/app.py's log_event() helper. That helper ALWAYS emits
# fields in this exact order -- ts, event, src_ip, username, outcome --
# so this regex can match the line structurally instead of trying to
# parse JSON (fail2ban's filter engine is line-regex based, not
# JSON-aware; a real production setup would run these logs through a
# proper JSON-aware log shipper instead -- named explicitly in the
# content file's Concept section as the thing this lab simplifies).
#
# <HOST> is fail2ban's own placeholder: it expands to an IP/hostname
# matcher and is what fail2ban extracts to know WHO to ban.
[Definition]
failregex = ^\{"ts": "[^"]+", "event": "login_attempt", "src_ip": "<HOST>", "username": "[^"]*", "outcome": "fail"\}$
ignoreregex =
