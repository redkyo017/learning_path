# dbmastery lab stack — PostgreSQL 16 configuration.
# Loaded via `postgres -c config_file=/etc/postgresql/postgresql.conf`
# (see docker-compose.yml). Local-only stack: password is `dbmastery`.

# Accept connections from other containers on the compose network (the
# default is `localhost` only, which would refuse `ws` and the host's
# published port).
listen_addresses = '*'

# --- Memory tuning (Global Constraints: deliberately small) --------------
#
# shared_buffers=256MB is DELIBERATELY small relative to the ~24 GB the
# learner's host actually has. This lab's dataset is sized so its working
# set exceeds this buffer pool: that is what makes `EXPLAIN (ANALYZE,
# BUFFERS)` report a meaningful mix of `shared hit` (found in the pool)
# versus `shared read` (fetched from the OS/disk), and what gives
# sequential scans real, visible cost. A generously sized buffer pool
# would cache the entire dataset in memory, every query would hit, and
# every buffer-accounting lesson in this course would teach the opposite
# of what happens on real, memory-constrained production systems. Do not
# raise this value.
shared_buffers = 256MB

# Per-sort/per-hash working memory, per operation. Small enough that
# multi-way sorts and hash joins on this dataset spill to disk
# (visible as "Sort Method: external merge" in EXPLAIN ANALYZE) rather
# than always fitting in memory.
work_mem = 4MB

# Planner's estimate of memory available for disk caching (OS cache +
# shared_buffers combined); influences index-vs-seqscan cost estimates.
# Kept in proportion with shared_buffers, not with the host's real RAM.
effective_cache_size = 768MB

# Memory for maintenance operations (VACUUM, CREATE INDEX, etc.).
maintenance_work_mem = 64MB

# Tracks how much time backends spend on actual block I/O, surfaced in
# EXPLAIN (ANALYZE, BUFFERS) and pg_stat_statements — required for the
# I/O-timing lessons in this course.
track_io_timing = on

# pg_stat_statements aggregates per-query execution statistics; several
# labs query it directly. Must be preloaded at server start.
shared_preload_libraries = 'pg_stat_statements'

# --- Durability / WAL (Global Constraints: mandatory for Day 6 PITR) -----
#
# wal_level=replica is the minimum level that emits enough WAL detail for
# archiving and physical replication; PITR restores replay WAL, so this
# cannot be `minimal`.
wal_level = replica

# Enables continuous WAL archiving. Day 6 restores a base backup and
# replays archived WAL up to a target point in time; without archiving
# there is nothing to replay past the last checkpoint. archive_mode
# cannot be changed without a server restart, which is why it is set
# here at stack bring-up rather than by a lab step.
archive_mode = on

# Copies each completed WAL segment into the pgarchive volume (mounted at
# /var/lib/postgresql/archive; see docker-compose.yml). The `test ! -f`
# guard makes the copy idempotent so Postgres can safely retry it.
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'

# Headroom for replication/backup connections (e.g. pg_basebackup during
# the Day 6 lab). Not all labs use this, but archiving-based PITR setups
# conventionally reserve WAL sender slots.
max_wal_senders = 3

# --- Logging ---------------------------------------------------------------
#
# Off because this is a single-writer container stack with docker logs
# already capturing stderr; the collector's rotated log files would only
# be an extra place to look.
logging_collector = off

# Logs any statement taking >= 500ms, the baseline "slow query" signal
# several labs teach the learner to read.
log_min_duration_statement = 500

# Logs when a backend waits on a lock — the primary signal for the
# lock-contention labs.
log_lock_waits = on

# --- Autovacuum --------------------------------------------------------------
#
# Left on (the default): labs that study bloat and vacuum behavior observe
# autovacuum's real, imperfect timing rather than a hand-run VACUUM.
autovacuum = on
