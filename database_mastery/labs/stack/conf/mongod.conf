# dbmastery lab stack — MongoDB 7 configuration.
# Mounted at /etc/mongod.conf and loaded via `mongod --config /etc/mongod.conf`
# (see docker-compose.yml). Local-only stack, no authentication configured
# (single-host lab environment, not reachable outside the host).

storage:
  wiredTiger:
    engineConfig:
      # DELIBERATELY small relative to the ~24 GB the learner's host
      # actually has, matching shared_buffers (Postgres) and
      # innodb_buffer_pool_size (MySQL). With the working set larger than
      # the WiredTiger cache, cache pressure and eviction become visible,
      # real effects instead of everything living in memory. Do not raise
      # this value.
      cacheSizeGB: 0.5

operationProfiling:
  # Logs (and records in system.profile) any operation slower than the
  # threshold below — the slow-operation signal the profiling labs read.
  mode: slowOp
  slowOpThresholdMs: 100

replication:
  # Single-member replica set. Mongo requires a replica set (even a
  # single-node one) to support multi-document transactions, which later
  # labs rely on.
  replSetName: rs0

net:
  # Accept connections from other containers on the compose network (the
  # default is loopback-only, which would refuse `ws` and the host's
  # published port).
  bindIp: 0.0.0.0
