# Canary copy of order-api: same image, own Service, one replica. The env var lets you tell it apart in `kubectl logs`/describe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api-canary
  namespace: orderflow
  labels:
    app: order-api-canary
    app.kubernetes.io/part-of: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api-canary
  template:
    metadata:
      labels:
        app: order-api-canary
        app.kubernetes.io/part-of: orderflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-api
          image: orderflow/order-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: orderflow-config
          env:
            - name: APP_VERSION
              value: "canary"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-api-canary
  namespace: orderflow
  labels:
    app: order-api-canary
    app.kubernetes.io/part-of: orderflow
spec:
  selector:
    app: order-api-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
