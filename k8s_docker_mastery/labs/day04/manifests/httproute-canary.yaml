# Header match + weighted split on the same route. Replaces httproute.yaml (same name) when applied.
# - requests with header "x-canary: true" go to order-api-canary
# - everyone else: 90% order-api, 10% order-api-canary
# order-api-canary is a second Deployment+Service made from the same image (see README Step 6).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orderflow
  namespace: orderflow
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  parentRefs:
    - name: edge
      namespace: gateway-infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders
          headers:
            - name: x-canary
              value: "true"
      backendRefs:
        - name: order-api-canary
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      backendRefs:
        - name: order-api
          port: 8080
          weight: 90
        - name: order-api-canary
          port: 8080
          weight: 10
