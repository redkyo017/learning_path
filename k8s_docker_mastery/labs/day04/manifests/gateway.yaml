# Platform-owned edge. Applied by Day 4; Days 6-7 re-apply it idempotently. Survives labs/shared/reset.sh.
# Prerequisite: Envoy Gateway installed (see labs/day04/README.md Step 2) - it installs the Gateway API CRDs.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-infra
  labels:
    app.kubernetes.io/part-of: platform
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: gateway-infra
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All      # app teams in any namespace may attach HTTPRoutes (tighten to Selector in production)
