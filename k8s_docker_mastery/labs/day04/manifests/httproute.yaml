# App-team-owned route: lives in orderflow, attaches to the platform's Gateway.
# /orders -> order-api. payment-service and notification-service have NO route: internal only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orderflow
  namespace: orderflow
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  parentRefs:
    - name: edge
      namespace: gateway-infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      backendRefs:
        - name: order-api
          port: 8080
