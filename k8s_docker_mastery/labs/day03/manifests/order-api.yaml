apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: orderflow
  labels:
    app: order-api
    app.kubernetes.io/part-of: orderflow
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # Fail the rollout (condition Progressing=False, reason ProgressDeadlineExceeded) after 45s without progress.
  # Kubernetes only REPORTS this; it never rolls back by itself.
  progressDeadlineSeconds: 45
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
        app.kubernetes.io/part-of: orderflow
    spec:
      # Pod-level defaults. Numeric UID 65532 matches the image's USER, so runAsNonRoot can be verified.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-api
          image: orderflow/order-api:v1
          imagePullPolicy: IfNotPresent   # pinned tag; the image is loaded by labs/shared/load-images.sh
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: orderflow-config
            - secretRef:
                name: orderflow-secrets
          env:
            # order-api exposes no version field, so the rollout demo changes this env together with the image tag.
            - name: APP_VERSION
              value: "v1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # startupProbe holds off liveness until the process answers /health (up to 30 x 2s).
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          # readiness = "send me traffic" (/ready goes 503 while draining); liveness = "restart me" (/health).
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: orderflow
  labels:
    app: order-api
    app.kubernetes.io/part-of: orderflow
spec:
  type: ClusterIP
  selector:
    app: order-api
  ports:
    - name: http
      port: 8080
      targetPort: http
