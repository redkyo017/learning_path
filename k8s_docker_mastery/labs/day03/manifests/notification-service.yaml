apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: orderflow
  labels:
    app: notification-service
    app.kubernetes.io/part-of: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/part-of: orderflow
    spec:
      # Pod-level defaults. Numeric UID 65532 matches the image's USER, so runAsNonRoot can be verified.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: orderflow/notification-service:v1
          imagePullPolicy: IfNotPresent   # pinned tag; the image is loaded by labs/shared/load-images.sh
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: PORT
              value: "8082"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # startupProbe holds off liveness until the process answers /health (up to 30 x 2s).
          startupProbe:
            httpGet:
              path: /health
              port: 8082
            periodSeconds: 2
            failureThreshold: 30
          # readiness = "send me traffic" (/ready goes 503 while draining); liveness = "restart me" (/health).
          readinessProbe:
            httpGet:
              path: /ready
              port: 8082
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: orderflow
  labels:
    app: notification-service
    app.kubernetes.io/part-of: orderflow
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8082
      targetPort: http
