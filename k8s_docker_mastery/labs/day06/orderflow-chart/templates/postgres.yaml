{{- if .Values.postgres.enabled }}
{{- $c := dict "root" . "component" "postgres" }}
{{- if not .Values.postgres.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orderflow.postgresSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orderflow.labels" $c | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
---
{{- end }}
# Headless Service: gives the StatefulSet pod a stable DNS name (<fullname>-postgres-0.<fullname>-postgres).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orderflow.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orderflow.labels" $c | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "orderflow.selectorLabels" $c | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "orderflow.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orderflow.labels" $c | nindent 4 }}
spec:
  serviceName: {{ include "orderflow.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "orderflow.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orderflow.labels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "orderflow.postgresPodSecurityContext" . | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          securityContext:
            {{- include "orderflow.containerSecurityContext" . | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/pg/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pg-secret
              mountPath: /run/secrets/pg
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.user | quote }}, "-d", {{ .Values.postgres.auth.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: pg-secret
          secret:
            secretName: {{ include "orderflow.postgresSecretName" . }}
            defaultMode: 0440
            items:
              - key: POSTGRES_PASSWORD
                path: password
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.postgres.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
{{- end }}
