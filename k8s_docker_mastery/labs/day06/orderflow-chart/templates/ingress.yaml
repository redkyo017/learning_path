{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orderflow.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orderflow.labels" (dict "root" . "component" "edge") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- with .Values.ingress.host }}
    - host: {{ . }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "orderflow.backendName" (dict "root" $ "service" .service) }}
                port:
                  number: {{ include "orderflow.backendPort" (dict "root" $ "service" .service) }}
          {{- end }}
{{- end }}
