# vpcr: the VPC resolver role (10.70.1.2). Names under onprem.corp go to the data center.
server:
  interface: 10.70.1.2
  access-control: 10.70.0.0/16 allow
  do-daemonize: no
  chroot: ""
  username: ""
  pidfile: ""
  # Short cache lifetimes so a changed path shows up on the next lookup.
  cache-max-ttl: 1
  cache-max-negative-ttl: 1

forward-zone:
  name: "onprem.corp."
  forward-addr: 192.168.20.53
