# dnsi: the VPC's resolver (the +2 address) with a private hosted zone.
server:
  interface: 10.6.10.53
  access-control: 0.0.0.0/0 allow
  do-daemonize: no
  chroot: ""
  username: ""
  pidfile: ""
  # The private hosted zone: only this view knows the private address.
  local-zone: "corp.internal." static
  local-data: "corp.internal. 60 IN SOA ns.corp.internal. hostmaster.corp.internal. 1 3600 600 86400 30"
  local-data: "app.corp.internal. 60 IN A 10.6.10.20"

# Outbound endpoint + forwarding rule: names under onprem.corp go to the on-prem DNS.
forward-zone:
  name: "onprem.corp."
  forward-addr: 10.6.10.60
