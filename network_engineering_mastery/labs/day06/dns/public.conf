# dnsp: the public view. Same name, the public address (split horizon).
server:
  interface: 10.6.10.54
  access-control: 0.0.0.0/0 allow
  do-daemonize: no
  chroot: ""
  username: ""
  pidfile: ""
  local-zone: "corp.internal." static
  local-data: "corp.internal. 60 IN SOA ns.corp.internal. hostmaster.corp.internal. 1 3600 600 86400 30"
  local-data: "app.corp.internal. 60 IN A 203.0.113.20"
  # The public view knows nothing about on-prem names; answer NXDOMAIN at once.
  local-zone: "onprem.corp." static
  local-data: "onprem.corp. 60 IN SOA ns.onprem.corp. hostmaster.onprem.corp. 1 3600 600 86400 30"
