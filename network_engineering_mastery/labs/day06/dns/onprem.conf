# odns: the on-prem DNS server.
server:
  interface: 10.6.10.60
  access-control: 0.0.0.0/0 allow
  do-daemonize: no
  chroot: ""
  username: ""
  pidfile: ""
  local-zone: "onprem.corp." static
  local-data: "onprem.corp. 60 IN SOA ns.onprem.corp. hostmaster.onprem.corp. 1 3600 600 86400 30"
  local-data: "db.onprem.corp. 60 IN A 192.168.20.5"

# Conditional forwarding to the VPC's inbound endpoint (dnsi's listening address).
forward-zone:
  name: "corp.internal."
  forward-addr: 10.6.10.53
