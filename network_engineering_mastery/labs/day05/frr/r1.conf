frr defaults traditional
hostname r1
!
route-map FROM-R3 permit 10
 set local-preference 200
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 10.5.12.2 remote-as 65002
 neighbor 10.5.12.2 timers connect 5
 neighbor 10.5.13.2 remote-as 65003
 neighbor 10.5.13.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.50.1.0/24
  neighbor 10.5.13.2 route-map FROM-R3 in
 exit-address-family
!
