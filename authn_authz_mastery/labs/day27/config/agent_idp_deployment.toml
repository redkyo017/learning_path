## Audit query examples (once structured logs are enabled)

# Query 1: All token exchanges by risk_scorer in the past 24 hours
# (Compliance officer runs this to audit the risk_scorer agent)
#
# SELECT timestamp, subject_client, actor_client, issued_scope, jti, policy_result
# FROM is73_audit_log
# WHERE actor_client = "risk_scorer"
#   AND event_type = "token_exchange"
#   AND timestamp > now() - interval '24 hours'
# ORDER BY timestamp DESC

# Query 2: All token exchanges for user alice_001 by any agent
# (Compliance officer audits a specific user's agent activity)
#
# SELECT timestamp, actor_client, issued_scope, jti, policy_result
# FROM is73_audit_log
# WHERE subject_client = "alice_001"
#   AND actor_client IS NOT NULL  -- non-null actor = agent-initiated
#   AND event_type = "token_exchange"
#   AND timestamp > now() - interval '7 days'
# ORDER BY timestamp DESC

# Query 3: All policy denials (unapproved agents attempting exchange)
# (Security team monitors for policy violation attempts)
#
# SELECT timestamp, subject_client, actor_client, policy_result, http_status
# FROM is73_audit_log
# WHERE policy_result = "DENY"
#   AND event_type = "token_exchange"
#   AND timestamp > now() - interval '1 hour'
# ORDER BY timestamp DESC
