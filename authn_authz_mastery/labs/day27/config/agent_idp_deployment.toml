# Day 27 Lab — IS 7.3 deployment.toml additions for Agent IdP

## Global token exchange grant enablement
[oauth]
# List all supported grant types (this is the global declaration).
# Per-application in Console, each app can opt in to specific grants.
allowed_grant_types = [
  "authorization_code",
  "refresh_token",
  "client_credentials",
  "urn:ietf:params:oauth:grant-type:token-exchange"
]

# Token exchange settings
[oauth.token_exchange]
# Enable RFC 8693 token exchange processing
enable = true

# Max chain depth (optional; prevents runaway delegation chains)
# Recommended: 3 hops (user → orchestrator → tool → API)
max_actor_chain_depth = 3

# Introspection cache TTL for revocation propagation
# Recommended: 300 seconds (5 minutes) for banking compliance
introspection_cache_ttl_seconds = 300

---

## Per-application actor trust policy configuration
# (Configure in IS 7.3 Console under Application → OAuth / OpenID Connect → Actor Trust)
# This is the JSON structure that the Console API accepts.

# Example API call:
# POST /api/identity/oauth2/actor-trust-policy
# Content-Type: application/json
# Authorization: Bearer <admin-token>

{
  "application_id": "<PLACEHOLDER: application-id>",
  "actor_trust_policies": [
    {
      "actor": "payment_orchestrator",
      "subject": "group:financial-users",
      "effect": "Allow",
      "description": "Trusted agent; approved for regular customer operations"
    },
    {
      "actor": "payment_orchestrator",
      "subject": "group:admins",
      "effect": "Deny",
      "description": "Admins authenticate directly; no agent mediation for high-privilege actions"
    },
    {
      "actor": "risk_scorer",
      "subject": "group:financial-users",
      "effect": "Deny",
      "description": "New agent; awaiting security review before production deployment"
    },
    {
      "actor": "risk_scorer",
      "subject": "group:admins",
      "effect": "Deny",
      "description": "High-privilege group; no agents permitted"
    },
    {
      "actor": "*",
      "subject": "group:super-admins",
      "effect": "Deny",
      "description": "Catch-all: no agents (any actor '*') should exchange super-admin tokens"
    }
  ]
}

