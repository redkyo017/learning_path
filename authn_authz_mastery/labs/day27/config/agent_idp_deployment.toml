## Agent DCR registration example (not TOML, but JSON for reference)
# File: agent_dcr_registration.json

# Agent 1: payment_orchestrator
# POST /api/identity/oauth2/dcr/v1.1/register
# Content-Type: application/json
# Authorization: Basic <PLACEHOLDER: admin-credentials-base64>

{
  "client_name": "payment_orchestrator",
  "description": "Orchestrator agent for payment processing workflows",
  "grant_types": [
    "urn:ietf:params:oauth:grant-type:token-exchange"
  ],
  "token_endpoint_auth_method": "private_key_jwt",
  "jwks_uri": "https://<PLACEHOLDER: orchestrator-host>:8443/.well-known/jwks.json",
  "response_types": [],
  "contacts": ["<PLACEHOLDER: ops-email@bank.com>"]
}

# IS 7.3 responds with:
{
  "client_id": "payment_orchestrator",
  "client_id_issued_at": 1696104000,
  "client_secret_expires_at": 0,
  "grant_types": [
    "urn:ietf:params:oauth:grant-type:token-exchange"
  ]
}

---

