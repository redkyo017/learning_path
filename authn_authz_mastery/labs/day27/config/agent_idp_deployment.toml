## Scope mapping: agent-specific scopes vs. user scopes
# (Configure in IS 7.3 Console under Application → Scopes)

# User-facing scopes (for customer app, human sessions):
# - payments:read
# - payments:write
# - accounts:read
# - accounts:write

# Agent-facing scopes (for agent orchestrator and tool agents):
# - agent:payments:initiate (narrower than payments:write; specific to orchestrator)
# - agent:payments:read (tools that only read payment info)
# - agent:accounts:read (tools that read account balances)

# In token exchange request, agent specifies:
# scope=agent:payments:initiate (not payments:write)

# IS 7.3 validates: agent scope must be subset of user's original scope.
# If user token has scope=payments:initiate but agent requests agent:payments:initiate,
# IS 7.3 checks: does payments:initiate (mapped) include agent:payments:initiate (mapped)?
# Scope mapping in Console allows fine-grained control.

