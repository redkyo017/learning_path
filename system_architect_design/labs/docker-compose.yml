# Shared lab stack. Bring up only what a given day needs:
#   docker compose up -d postgres redis         # Day 3, 6, 8
#   docker compose up -d kafka                   # Day 14, 16
#   docker compose --profile obs up -d           # Day 11 (adds jaeger + prometheus)
# Tear down at the end of every day:
#   docker compose down -v
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Day 18 (RAG) swaps the image to pgvector/pgvector:pg16 and runs
  # `CREATE EXTENSION IF NOT EXISTS vector;`  (see days/day18-llm-rag/lab)
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0        # KRaft mode — no ZooKeeper
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Fault injection proxy (Days 4, 8, 9). Put a dependency behind Toxiproxy and
  # add latency/failure "toxics" via its API on :8474.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports: ["8474:8474", "16379:16379", "18080:18080"]
    profiles: ["fault"]

  # Observability stack (Day 11) — only starts with `--profile obs`.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports: ["16686:16686", "4318:4318"]   # UI + OTLP/HTTP
    profiles: ["obs"]

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles: ["obs"]
