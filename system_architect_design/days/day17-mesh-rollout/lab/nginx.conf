# OPTIONAL alternative router (instead of Traefik) using nginx weighted upstreams
# with PASSIVE health checks (max_fails / fail_timeout). Weight 9:1 ~= 90/10.
#
# To use nginx instead of Traefik, swap the traefik service in docker-compose.yml
# for:
#   nginx:
#     image: nginx:1.27-alpine
#     ports: ["8080:80"]
#     volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
#     depends_on: [orders-v1, orders-v2]
#
# Note the tradeoff vs Traefik: nginx OSS health checks are PASSIVE — a node is
# only marked down after `max_fails` real requests fail within `fail_timeout`.
# Traefik's ACTIVE health check probes /health on an interval and removes the
# node proactively (cleaner for the "v2 fails health mid-canary" break-it step).
events {}
http {
  upstream orders {
    server orders-v1:8080 weight=9 max_fails=2 fail_timeout=5s;
    server orders-v2:8080 weight=1 max_fails=2 fail_timeout=5s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://orders;
      proxy_set_header Host $host;
    }
  }
}
