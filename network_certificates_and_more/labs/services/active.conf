# labs/services/active.conf
#
# This is the ACTIVE nginx config: docker-compose.yml bind-mounts this one
# file to /etc/nginx/conf.d/default.conf, so nginx only ever loads whatever
# is here. Each day's lab activates its own config by copying it over this
# file, e.g.:
#   cp services/nginx-day02.conf services/active.conf
#   cp services/nginx-mtls.conf  services/active.conf
# then starting or restarting nginx so it picks up the new content.
#
# Seeded here with Day 2's plain-TLS config so `docker compose up -d nginx`
# works out of the box before any lab step runs.

server {
    listen 443 ssl;
    server_name example.local;

    ssl_certificate     /etc/nginx/certs/example.local.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/example.local.key.pem;

    location / {
        default_type text/plain;
        return 200 "example.local is up — TLS Mastery Day 2\n";
    }
}
