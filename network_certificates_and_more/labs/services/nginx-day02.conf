# nginx-day02.conf — Day 2 "become a CA" guided lab.
#
# Serves example.local on :443 (mapped to host :8443 by docker-compose.yml)
# using the leaf certificate + chain issued in Day 2's guided lab.
#
# Cert material is read from /etc/nginx/certs/ (bind-mounted from
# labs/certs/ per docker-compose.yml), NOT from /work/ca/ directly — nginx
# never mounts ca/, so the guided lab's Part D copies the fullchain and key
# into labs/certs/ first:
#
#   cat ca/intermediate/certs/example.local.cert.pem \
#       ca/intermediate/certs/ca-chain.cert.pem \
#       > certs/example.local.fullchain.pem
#   cp ca/intermediate/private/example.local.key.pem certs/example.local.key.pem
#
# example.local.fullchain.pem is leaf + intermediate + root, concatenated
# in that order (the order TLS requires certs to be sent in). Sending the
# root too is unnecessary in a real production setup (clients only need
# leaf+intermediate; the root should already be in their trust store on its
# own) but is harmless here and keeps this file's construction dead simple
# for a Day-2 lab: it's exactly `cat leaf ca-chain.cert.pem`, nothing more.

server {
    listen 443 ssl;
    server_name example.local;

    ssl_certificate     /etc/nginx/certs/example.local.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/example.local.key.pem;

    location / {
        default_type text/plain;
        return 200 "example.local is up — TLS Mastery Day 2\n";
    }
}
