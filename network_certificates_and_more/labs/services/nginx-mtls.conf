# labs/services/nginx-mtls.conf
#
# Day 4 — mutual TLS. This does everything Day 2's config did (nginx proves
# ITS identity to the client with a normal server certificate) PLUS a second,
# independent check running in the opposite direction: ssl_verify_client
# forces the CLIENT to prove ITS identity to nginx before nginx will process
# the request at all.
#
# Both directives below express the SAME four-check verification from Day 1
# — signature chain -> validity dates -> name match -> trust anchor — just
# pointed at a different certificate and a different trust anchor file each
# time:
#   ssl_certificate / ssl_certificate_key   -> the SERVER's identity, which
#       the CLIENT verifies (against whatever CA file the client passes to
#       --cacert / curl's own trust store).
#   ssl_client_certificate / ssl_verify_client -> the CLIENT's identity,
#       which nginx (the SERVER) verifies, against THIS file — a completely
#       separate trust decision from whatever the client used above, even
#       though in this lab both directions happen to point at the same
#       ca-chain.cert.pem, because we built one CA and used it for both
#       roles.
#
# NOTE — activation: nginx only loads services/active.conf (see
# docker-compose.yml's bind mount), so this file has no effect until it's
# copied over that one: `cp services/nginx-mtls.conf services/active.conf`,
# then `docker compose restart nginx` (see Day 4's guided lab).

server {
    listen 443 ssl;
    server_name example.local;

    # --- Server side of the handshake: nginx proves ITS identity ---
    # (Same cert/chain Day 2 issued for example.local — unchanged by mTLS.)
    ssl_certificate     /etc/nginx/certs/example.local.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/example.local.key.pem;

    # --- Client side of the handshake: nginx now DEMANDS and VERIFIES ---
    # --- the client's identity too. This is the mTLS half.            ---
    # ssl_client_certificate names the trust anchor nginx uses to run the
    # four checks against whatever certificate the client presents — it is
    # nginx's equivalent of curl's --cacert, scoped specifically to client
    # certs.
    ssl_client_certificate /etc/nginx/certs/ca-chain.cert.pem;
    ssl_verify_client on;

    location / {
        return 200 "mTLS OK — client cert verified.\n";
        add_header Content-Type text/plain;
    }
}
