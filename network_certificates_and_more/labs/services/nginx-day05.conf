# nginx-day05.conf — Day 5 "automation with ACME" guided lab, Part C.
#
# Serves test.local on :443 (mapped to host :8443 by docker-compose.yml)
# using the certificate certbot actually obtained from the local Pebble ACME
# server in Part B — NOT this course's own private CA (ca/). This is the
# one day where the certificate serving nginx was never hand-issued by
# ca/issue-server-cert.sh at all; it was requested and signed entirely
# through the ACME protocol, by an intermediate Pebble generated on its
# own, at a moment certbot never asked you to configure.
#
# Cert material is read from /etc/nginx/certs/ (bind-mounted from
# labs/certs/ per docker-compose.yml) — nginx never mounts labs/acme/
# directly, so the guided lab's Part C copies certbot's issued
# fullchain.pem/privkey.pem into labs/certs/ first:
#
#   cp acme/certbot/config/live/test.local/fullchain.pem certs/test.local.fullchain.pem
#   cp acme/certbot/config/live/test.local/privkey.pem   certs/test.local.key.pem
#
# The teaching point Part C exists to make concrete: this certificate's
# issuer is Pebble's ACME intermediate, a completely different CA from
# ca/intermediate/ (the private CA you built and used on every prior day).
# Verifying it requires trusting *that* chain
# (acme/certbot/config/live/test.local/chain.pem), not ca-chain.cert.pem —
# check 4 (trust anchor) again, just against a different issuer than every
# earlier day used.

server {
    listen 443 ssl;
    server_name test.local;

    ssl_certificate     /etc/nginx/certs/test.local.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/test.local.key.pem;

    location / {
        default_type text/plain;
        return 200 "test.local is up -- issued by ACME (Pebble), Day 5\n";
    }
}
