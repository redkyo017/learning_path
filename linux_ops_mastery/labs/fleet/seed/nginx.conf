# proxy -> app. Day 6's connectivity ladder runs through this file.
#
# Two things are deliberate here, and they pull in opposite directions.
#
# 1. Resolution is DEFERRED to request time, by putting the upstream in a
#    variable. `proxy_pass http://app:8080;` -- a literal name -- makes nginx
#    resolve `app` once while parsing this file, and refuse to start at all
#    with "host not found in upstream" if `app` happens to be down. `app` IS
#    down at times, by design: Day 4 OOM-kills it. A proxy that cannot boot
#    while its backend is dead would turn every later day into a fight with
#    nginx.
#
# 2. The resolver comes from /etc/resolv.conf -- via the included
#    /etc/nginx/resolver.conf, which the image's `nginx` wrapper
#    (labs/fleet/nginx-resolver-wrapper.sh) rewrites on every start and
#    reload -- instead of a hard-coded address. An explicit
#    `resolver 127.0.0.11` would keep resolving `app` through Docker's
#    embedded DNS no matter what /etc/resolv.conf said -- and Day 6 fault 1
#    rewrites /etc/resolv.conf on this container and expects the proxy path
#    to break. With a hard-coded resolver that fault passes silently, which
#    is worse than not injecting it.
#
#    Stock nginx has no built-in "use /etc/resolv.conf" option (`resolver
#    local=on`, used here before, is accepted by no upstream nginx and made
#    the proxy refuse to start), hence the wrapper.
#
# MECHANISM, and Day 6 has to respect it: nginx reads its resolver
# configuration when it loads the config, not per request. Rewriting
# /etc/resolv.conf changes nothing until the config is reloaded, so fault 1
# must run
#
#     nginx -s reload
#
# after editing the file. `valid=10s` caps how long a resolved answer is
# cached, so a recreated `app` is picked up within ten seconds; it does not
# re-read resolv.conf.
#
# `nginx -T` shows the resolver line actually in effect.

include /etc/nginx/resolver.conf;

server {
    listen 80;
    server_name _;

    # Log to stdout/stderr so `docker compose logs proxy` is the whole story.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        # The variable is what defers resolution. Removing it puts the
        # start-up failure back -- see the note at the top of this file.
        set $upstream app:8080;
        proxy_pass http://$upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }
}
